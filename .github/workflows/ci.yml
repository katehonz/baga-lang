name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core compiler (C backend, smoke, self-hosting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # katehonz GITHUB_TOKEN → authenticated 404 on bagalang/*. Drop the
      # extraheader, rewrite SSH to anonymous HTTPS, fetch only smoke deps.
      - name: Submodules (httpdbaga jwtbaga otpbaga)
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --global url.https://github.com/.insteadOf git@github.com:
          GIT_TERMINAL_PROMPT=0 git submodule update --init --depth 1 -- \
            app-product/httpdbaga \
            app-product/jwtbaga \
            app-product/otpbaga
          test -f app-product/httpdbaga/http.baga
          test -f app-product/jwtbaga/jwt.baga
          test -f app-product/otpbaga/otp.baga

      - name: Build
        run: make && make sandak && ls -l baga sandak

      - name: Example zdravei
        run: ./baga examples/zdravei.baga

      - name: --check httpdbaga
        run: ./baga -I . --check app-product/httpdbaga/http.baga

      - name: hmac_test
        run: ./baga -I . -I app-product tests/std/hmac_test.baga

      - name: jwt_test
        run: ./baga -I . -I app-product tests/jwt_test.baga

      - name: otp_test
        run: ./baga -I . -I app-product tests/otp_test.baga

      - name: Self-hosting fixed point (baga2 == baga3)
        run: make self

  llvm:
    name: LLVM backend (oracle vs C backend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LLVM 14
        run: sudo apt-get update && sudo apt-get install -y llvm-14

      - name: Build LLVM backend
        run: make llvm

      - name: Oracle (C vs lli-14, byte-for-byte)
        run: make test-llvm
