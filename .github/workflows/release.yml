name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-linux:
    name: Linux x86_64 binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Package
        run: |
          mkdir -p dist/baga
          cp baga dist/baga/
          cp -r examples docs std README.md dist/baga/
          tar -czf baga-linux-x86_64.tar.gz -C dist baga
          sha256sum baga-linux-x86_64.tar.gz > baga-linux-x86_64.tar.gz.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            baga-linux-x86_64.tar.gz
            baga-linux-x86_64.tar.gz.sha256
